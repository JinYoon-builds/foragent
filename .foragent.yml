repo: JinYoon-builds/foragent  # 2026-10-30: pushes failed 255x with 'claude-push requires a repository' since >=10-28
review: fast
executor: claude  # 2026-10-23 14:4x: #247 fixed the /goal prompt (live-checked); Claude quota idle. Reviewer becomes codex. D74 will choose per issue
language: ko
approvers:
- JinYoon-builds
lanes:
  adopt:
    paths:
    - src/foragent/adopt.py
    - skills/fa-init/**
    - tests/test_adopt.py
    agent: fa-adopt
    skills: [principle-prove-it-works, principle-fix-root-causes]
  order:
    paths:
    - src/foragent/order.py
    - src/foragent/config.py
    - skills/fa-order/**
    - tests/test_order.py
    - tests/test_config.py
    agent: fa-order
    skills:
    - skill-creator
    - testing-strategy
    - principle-prove-it-works
    - principle-fix-root-causes
  bench:
    paths:
    - src/foragent/bench.py
    - bench/**
    - tests/test_bench.py
    agent: fa-bench
    skills: [principle-prove-it-works, principle-fix-root-causes]
  orch:
    paths:
    - src/foragent/orch*.py
    - src/foragent/scheduler.py
    - src/foragent/runner.py
    - src/foragent/reasons.py
    - skills/fa-orchestrator/**
    agent: fa-orch
    skills:
    - testing-strategy
    - principle-prove-it-works
    - principle-fix-root-causes
    - fa-state-design
  view:
    paths:
    - src/foragent/watch*.py
    - src/foragent/status*.py
    - src/foragent/cli.py
    - src/foragent/notify*.py
    - src/foragent/i18n*.py
    agent: fa-view
    skills:
    - fa-ux-copy
    - principle-prove-it-works
    - principle-fix-root-causes
  board:
    paths:
    - src/foragent/board*.py
    - src/foragent/init.py
    - src/foragent/order.py
    - src/foragent/tracker.py
    agent: fa-board
    skills: [principle-prove-it-works, principle-fix-root-causes, fa-state-design]
  skills:
    paths:
    - src/foragent/skills.py
    - src/foragent/lanes.py
    - src/foragent/git.py
    agent: fa-skills
    skills:
    - skill-creator
    - principle-prove-it-works
    - principle-fix-root-causes
    - fa-state-design
  design:
    paths:
    - src/foragent/design*.py
    - skills/fa-order/**
    - skills/fa-init/**
    agent: fa-design
    skills:
    - skill-creator
    - principle-prove-it-works
    - principle-fix-root-causes
  review-engine:
    paths: [src/foragent/run_review.py, src/foragent/run_prompts.py, src/foragent/review_*.py, src/foragent/orch_reviewers.py]
    agent: fa-review-engine
    skills: [testing-strategy, principle-prove-it-works, principle-fix-root-causes]
    title: 리뷰 장치
  roles:
    paths: [src/foragent/orch_architect*.py, src/foragent/orch_role*.py, src/foragent/orch_dream*.py, src/foragent/orch_inbox.py, src/foragent/orch_facts*.py, skills/fa-orchestrator/**, skills/fa-architect/**, skills/fa-docs/**]
    agent: fa-roles
    skills: [skill-creator, principle-prove-it-works, principle-fix-root-causes, fa-state-design]
    title: 역할
board: PVT_kwHODvdhm84BoMtn  # restored 2026-10-24 after #221: ticks write only changed board cards
test_slots: 4  # 2026-11-01: 3 check timeouts (#1322 #1206 #1004) with 5 slots at load 1.15 per CPU, CPU 90%; baselines 1100-1500 s vs limit 1538 s
checks: ci  # 2026-10-26 Jin: CI mode on after #493/#506 (evidence = the measurement run's own artifacts). Revert to local in one commit if evidence is missing or rejected
max_runtime_minutes: 360  # 2026-10-25 Jin (D89): interim until the #435 watchdog; progressing runs were cut at 90 min. stall_minutes (30, no progress) still ends silent runs
# Raised from 2 on 2026-10-26: 1 conflict (598 s, no redo) in 107 overlap records; earlier 33 conflict events took 189 s median, while cap waits held 5 ready issues for hours.
overlap_per_file: 3
roles:
  orchestrator:
    agent: fa-orchestrator
    skills:
    - fa-orchestrator
    memory: .claude/agent-memory/fa-orchestrator/
    signals: []
    created_at: '2026-10-27T07:58:05+00:00'
  architect:
    agent: fa-architect
    skills:
    - fa-architect
    memory: .claude/agent-memory/fa-architect/
    signals:
    - paths: []
      kinds:
      - repeated_design_holds
    - paths: []
      kinds:
      - hot_overlap_files
    - paths: []
      kinds:
      - files_over_limit
    - paths: []
      kinds:
      - idle_lanes_with_backlog
    - paths: []
      kinds:
      - lane_concentration
    created_at: '2026-10-27T07:58:05+00:00'
  docs:
    agent: fa-docs
    skills:
    - fa-docs
    memory: .claude/agent-memory/fa-docs/
    signals:
    - paths:
      - docs/**
      - README*
      kinds: []
    scope:
    - docs/**
    - README*
    created_at: '2026-10-27T07:58:05+00:00'

# 2026-11-01 Jin: groups off and one overlap limit while the merge path is simplified (r244, r247). Re-decided after I6.
merge_group_max: 1
overlap_mode: fixed
