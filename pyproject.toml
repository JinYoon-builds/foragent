[project]
name = "foragent"
version = "0.1.0"
description = "Your agent forages for the next task: an issue-queue scheduler for coding agents."
readme = "README.md"
authors = [
    { name = "Jin.Yoon", email = "jin.yoon.builds@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = [
    "psutil>=7.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
foragent = "foragent.cli:main"
fa = "foragent.cli:main"

[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
# The role skills fa init copies into each project (role_agents.py finds them).
"share/foragent/skills/fa-orchestrator" = ["skills/fa-orchestrator/*.md"]
"share/foragent/skills/fa-orchestrator/references" = ["skills/fa-orchestrator/references/*.md"]
"share/foragent/skills/fa-architect" = ["skills/fa-architect/*.md"]
"share/foragent/skills/fa-architect/references" = ["skills/fa-architect/references/*.md"]
"share/foragent/skills/fa-docs" = ["skills/fa-docs/*.md"]
# The vendored pstack library (skills.py vendored_library finds it): manifest, license and its skills.
"share/foragent/skills/pstack" = ["skills/pstack/library.yml", "skills/pstack/LICENSE", "skills/pstack/README.md"]
"share/foragent/skills/principle-attack-the-premise" = ["skills/principle-attack-the-premise/SKILL.md", "skills/principle-attack-the-premise/LICENSE"]
"share/foragent/skills/principle-boundary-discipline" = ["skills/principle-boundary-discipline/SKILL.md", "skills/principle-boundary-discipline/LICENSE"]
"share/foragent/skills/principle-build-the-lever" = ["skills/principle-build-the-lever/SKILL.md", "skills/principle-build-the-lever/LICENSE"]
"share/foragent/skills/principle-encode-lessons-in-structure" = ["skills/principle-encode-lessons-in-structure/SKILL.md", "skills/principle-encode-lessons-in-structure/LICENSE"]
"share/foragent/skills/principle-exhaust-the-design-space" = ["skills/principle-exhaust-the-design-space/SKILL.md", "skills/principle-exhaust-the-design-space/LICENSE"]
"share/foragent/skills/principle-experience-first" = ["skills/principle-experience-first/SKILL.md", "skills/principle-experience-first/LICENSE"]
"share/foragent/skills/principle-explain-the-number" = ["skills/principle-explain-the-number/SKILL.md", "skills/principle-explain-the-number/LICENSE"]
"share/foragent/skills/principle-fix-root-causes" = ["skills/principle-fix-root-causes/SKILL.md", "skills/principle-fix-root-causes/LICENSE"]
"share/foragent/skills/principle-foundational-thinking" = ["skills/principle-foundational-thinking/SKILL.md", "skills/principle-foundational-thinking/LICENSE"]
"share/foragent/skills/principle-guard-the-context-window" = ["skills/principle-guard-the-context-window/SKILL.md", "skills/principle-guard-the-context-window/LICENSE"]
"share/foragent/skills/principle-laziness-protocol" = ["skills/principle-laziness-protocol/SKILL.md", "skills/principle-laziness-protocol/LICENSE"]
"share/foragent/skills/principle-make-operations-idempotent" = ["skills/principle-make-operations-idempotent/SKILL.md", "skills/principle-make-operations-idempotent/LICENSE"]
"share/foragent/skills/principle-migrate-callers-then-delete-legacy-apis" = ["skills/principle-migrate-callers-then-delete-legacy-apis/SKILL.md", "skills/principle-migrate-callers-then-delete-legacy-apis/LICENSE"]
"share/foragent/skills/principle-minimize-reader-load" = ["skills/principle-minimize-reader-load/SKILL.md", "skills/principle-minimize-reader-load/LICENSE"]
"share/foragent/skills/principle-model-the-domain" = ["skills/principle-model-the-domain/SKILL.md", "skills/principle-model-the-domain/LICENSE"]
"share/foragent/skills/principle-never-block-on-the-human" = ["skills/principle-never-block-on-the-human/SKILL.md", "skills/principle-never-block-on-the-human/LICENSE"]
"share/foragent/skills/principle-outcome-oriented-execution" = ["skills/principle-outcome-oriented-execution/SKILL.md", "skills/principle-outcome-oriented-execution/LICENSE"]
"share/foragent/skills/principle-prove-it-works" = ["skills/principle-prove-it-works/SKILL.md", "skills/principle-prove-it-works/LICENSE"]
"share/foragent/skills/principle-redesign-from-first-principles" = ["skills/principle-redesign-from-first-principles/SKILL.md", "skills/principle-redesign-from-first-principles/LICENSE"]
"share/foragent/skills/principle-separate-before-serializing-shared-state" = ["skills/principle-separate-before-serializing-shared-state/SKILL.md", "skills/principle-separate-before-serializing-shared-state/LICENSE"]
"share/foragent/skills/principle-sequence-verifiable-units" = ["skills/principle-sequence-verifiable-units/SKILL.md", "skills/principle-sequence-verifiable-units/LICENSE"]
"share/foragent/skills/principle-subtract-before-you-add" = ["skills/principle-subtract-before-you-add/SKILL.md", "skills/principle-subtract-before-you-add/LICENSE"]
"share/foragent/skills/principle-test-behavior-not-implementation" = ["skills/principle-test-behavior-not-implementation/SKILL.md", "skills/principle-test-behavior-not-implementation/LICENSE"]
"share/foragent/skills/principle-type-system-discipline" = ["skills/principle-type-system-discipline/SKILL.md", "skills/principle-type-system-discipline/LICENSE"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { git = { commit = true } }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["local_only: requires machine tools or macOS integrations; run locally"]
