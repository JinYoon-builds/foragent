[project]
name = "foragent"
version = "0.1.0"
description = "Your agent forages for the next task: an issue-queue scheduler for coding agents."
readme = "README.md"
authors = [
    { name = "Jin.Yoon", email = "jin.yoon.builds@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
foragent = "foragent.cli:main"
fa = "foragent.cli:main"

[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "skills/fa-design-session/SKILL.md" }, { git = { commit = true } }]

[tool.setuptools.data-files]
"share/foragent/skills/fa-design-session" = ["skills/fa-design-session/SKILL.md"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
