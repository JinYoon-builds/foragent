name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest --collect-only -q
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - run: git config --global user.email ci@localhost && git config --global user.name ci
      - run: uv run python -m foragent.ci_unit_shard
        env:
          FA_SHARD: ${{ matrix.shard }}
          FA_SHARDS: 4
          FA_REPORT_FILE: ${{ runner.temp }}/unit-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/unit-${{ matrix.shard }}.xml
          if-no-files-found: error
