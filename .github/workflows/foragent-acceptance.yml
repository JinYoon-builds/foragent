# Generated by fa ci workflow; edit .foragent.yml, then regenerate.
name: foragent-acceptance
'on':
  pull_request: null
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  acceptance:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
      == github.repository && (startsWith(github.event.pull_request.head.ref, 'foragent/issue-')
      || startsWith(github.event.pull_request.head.ref, 'foragent/group-')) && github.event.pull_request.base.ref
      == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
    outputs:
      comparison: ${{ steps.compare.outputs.comparison }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@v6
    - name: Restore trusted base node results
      id: base-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/acceptance-base.json
        key: foragent-acceptance-base-v1-${{ github.event.pull_request.base.sha }}
    - name: Verify base cache branch origin
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ${{ github.token }}
        FA_BASE_CACHE_FILE: ${{ runner.temp }}/acceptance-base.json
        FA_BASE_CACHE_KEY: foragent-acceptance-base-v1-${{ github.event.pull_request.base.sha
          }}
        FA_BASE_CACHE_MATCHED_KEY: ${{ steps.base-cache.outputs.cache-matched-key
          }}
        FA_BASE_CACHE_REF: refs/heads/main
      run: "if ! uv run --no-project --python 3.12 --with pytest --with 'foragent\
        \ @ git+https://github.com/JinYoon-builds/foragent' python -m foragent.ci_base_cache;\
        \ then\n  rm -f -- \"$FA_BASE_CACHE_FILE\"\n  echo \"Trusted base cache verification\
        \ unavailable; measuring selected base nodes.\"\nfi\n"
    - name: Compare acceptance passing sets
      id: compare
      working-directory: ${{ runner.temp }}
      env:
        FA_REPOSITORY: ${{ github.repository }}
        FA_CHECKOUT: ${{ github.workspace }}
        FA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        FA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FA_SHARD: ${{ matrix.shard }}
        FA_SHARDS: '4'
        FA_BASE_CACHE_FILE: ${{ runner.temp }}/acceptance-base.json
        FA_REPORT_FILE: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
      run: uv run --no-project --python 3.12 --with pytest --with 'foragent @ git+https://github.com/JinYoon-builds/foragent'
        python -m foragent.ci_shard
    - uses: actions/upload-artifact@v4
      if: steps.compare.outputs.comparison != ''
      with:
        name: acceptance-${{ matrix.shard }}
        path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
        if-no-files-found: error
  acceptance-base:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@v6
    - name: Measure full portable base selection
      id: produce
      working-directory: ${{ runner.temp }}
      env:
        FA_REPOSITORY: ${{ github.repository }}
        FA_CHECKOUT: ${{ github.workspace }}
        FA_BASE_SHA: ${{ github.sha }}
        FA_HEAD_SHA: ${{ github.sha }}
        FA_BASE_CACHE_MODE: produce
        FA_BASE_CACHE_FILE: ${{ runner.temp }}/acceptance-base.json
      run: "rm -f -- \"$FA_BASE_CACHE_FILE\"\nif uv run --no-project --python 3.12\
        \ --with pytest --with 'foragent @ git+https://github.com/JinYoon-builds/foragent'\
        \ python -c 'import sys; from foragent import ci_shard; sys.exit(not callable(getattr(ci_shard,\
        \ \"produce\", None)))'; then\n  uv run --no-project --python 3.12 --with\
        \ pytest --with 'foragent @ git+https://github.com/JinYoon-builds/foragent'\
        \ python -m foragent.ci_shard\n  if [ -s \"$FA_BASE_CACHE_FILE\" ]; then\n\
        \    echo \"cache=true\" >> \"$GITHUB_OUTPUT\"\n  fi\nelse\n  echo \"Trusted\
        \ tool has no base cache producer; skipping reusable base results.\"\nfi\n"
    - name: Save trusted base node results
      uses: actions/cache/save@v4
      if: steps.produce.outputs.cache == 'true'
      with:
        path: ${{ runner.temp }}/acceptance-base.json
        key: foragent-acceptance-base-v1-${{ github.sha }}
