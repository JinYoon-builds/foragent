# Generated by fa ci workflow.
name: foragent-acceptance-publish
'on':
  workflow_run:
    workflows:
    - foragent-acceptance
    types:
    - completed
permissions:
  actions: read
  checks: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event
      == 'pull_request' && github.event.workflow_run.head_repository.full_name ==
      github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: astral-sh/setup-uv@v6
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}
        pattern: acceptance-*
        merge-multiple: true
        path: ${{ runner.temp }}/acceptance-reports
    - name: Publish acceptance checks
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ${{ github.token }}
        FA_REPOSITORY: ${{ github.repository }}
        FA_SHARDS: '4'
        FA_REPORT_DIR: ${{ runner.temp }}/acceptance-reports
      run: uv run --no-project --python 3.12 --with pytest --with 'foragent @ git+https://github.com/JinYoon-builds/foragent'
        python -m foragent.ci_publish
